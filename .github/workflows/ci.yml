name: Messaging checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-modern.txt
      - run: pip install -r requirements-modern.txt
      - run: python -m pytest -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: SECRET_KEY=ci-only-random-test-configuration docker compose up --build -d --wait
      - run: curl --fail http://localhost:5000/health/ready
      - if: always()
        run: docker compose logs --no-color
  multiworker:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-modern.txt
      - run: python -m pytest tests/test_multiworker.py -q
        env:
          INTEGRATION_SERVICES: '1'
